name: Expressive Profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .profile/post-render.mjs
      - .github/workflows/expressive-profile.yml

permissions:
  contents: write

concurrency:
  group: expressive-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: metawka/expressive-profile@v1
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Render the remaining original sections in the same design system
        shell: bash
        run: |
          node .profile/post-render.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Render complete premium profile" && git push)
