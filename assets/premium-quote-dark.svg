<svg xmlns="http://www.w3.org/2000/svg" width="840" height="182" viewBox="0 0 840 182"><rect x="2" y="2" width="836" height="178" rx="28" fill="#171c1e"/><circle cx="48" cy="47" r="18" fill="#004e5d"/><path d="M40 47h16M48 39v16" stroke="#aeecff" stroke-width="2.5" stroke-linecap="round"/><text x="80" y="54" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#dee3e6">Random Developer Quote</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="13" fill="#aab7bd">A little inspiration for the next thing you build</text><rect x="28" y="104" width="784" height="40" rx="13" fill="#252b2d"/><circle cx="52" cy="124" r="5" fill="#aeecff"/><text x="70" y="130" font-family="Arial,sans-serif" font-size="16" fill="#dee3e6">“Great things are done by a series of small things brought together.” — Vincent van Gogh</text></svg>